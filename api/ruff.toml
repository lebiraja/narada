target-version = "py313"
line-length = 110

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends()/Header() defaults

# Pre-existing findings in files other work streams own; clear these as they land.
[lint.per-file-ignores]
"app/core/conductor.py" = ["F401"]
"app/core/metrics.py" = ["B905"]
"app/core/session.py" = ["F401"]
"app/mcp/server.py" = ["F401", "I001"]
"scripts/*" = ["F401", "B904", "B007"]
"tests/test_mcp.py" = ["F401"]
"tests/test_midi.py" = ["I001", "B905"]
"tests/test_theory.py" = ["F401", "I001"]
